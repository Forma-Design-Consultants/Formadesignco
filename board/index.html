<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="description" content="Forma project workflow board"><link rel="canonical" href="https://www.formadesignconsultants.com/board/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forma • Project Board</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172638;font:14px system-ui}header{background:#12243b;color:white;padding:26px 32px;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:5px 0}small{letter-spacing:2px;color:#aebfd3}.toolbar{padding:24px 32px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}input,select,textarea{font:inherit;padding:11px;border:1px solid #d7dde6;border-radius:8px;background:white}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:#152d49;color:white}button.secondary{background:#e8edf3;color:#20354e}.board{display:flex;gap:16px;overflow:auto;padding:0 32px 35px;min-height:65vh}.column{flex:0 0 285px;background:#e9edf2;border-radius:12px;padding:14px}.colhead{display:flex;justify-content:space-between;align-items:center;font-weight:650;margin:0 0 16px}.count{background:white;padding:3px 8px;border-radius:6px;color:#66758a}.card{background:white;border:1px solid #e1e6ed;border-radius:10px;padding:17px;margin-bottom:12px;cursor:grab;box-shadow:0 2px 4px #152d4905}.card:hover{border-color:#8da8c8}.card h3{font-size:15px;margin:10px 0}.card p{color:#6d7988;margin:8px 0;line-height:1.5}.tag{font-size:11px;border-radius:5px;padding:4px 7px;background:#ecf1f8;color:#415c7c}.High{background:#fff0e9;color:#b7582a}.Low{background:#eaf5ee;color:#367b4c}.meta{display:flex;justify-content:space-between;border-top:1px solid #f0f2f5;padding-top:12px;margin-top:14px;color:#6d7988;font-size:12px}.empty{border:1px dashed #c6d0dc;border-radius:10px;text-align:center;padding:28px 12px;color:#7a8899}.plus{background:transparent;color:#687c94;padding:3px 8px;font-size:20px}dialog{border:0;border-radius:16px;padding:28px;width:520px;max-width:95vw;box-shadow:0 20px 80px #0003}dialog::backdrop{background:#10213680}form{display:grid;gap:13px}label{display:grid;gap:6px;color:#546579;font-size:12px}.row{display:flex;gap:12px}.row>*{flex:1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}#status{color:#6c7e91;font-size:12px;margin-left:auto}.drop{outline:2px solid #7198c2}.danger{background:#fff0ef!important;color:#ac3b34!important}footer{padding:0 32px 20px;color:#8290a0;font-size:12px}@media(max-width:600px){header,.toolbar{padding:20px}.board{padding:0 20px 25px}header small{font-size:10px}}

html{-webkit-text-size-adjust:100%}button,input,select,textarea{min-height:44px}button{touch-action:manipulation}input,select,textarea{font-size:16px}header{gap:20px}.board{-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain}.column{scroll-snap-align:start}.card{touch-action:pan-x pan-y}.stagejump{display:none}.move-label{margin-top:12px;font-size:11px;color:#6d7988}.move-stage{width:100%;margin-top:5px;font-size:13px;min-height:44px;border-color:#e1e6ed}dialog{max-height:calc(100dvh - 40px);overflow-y:auto}textarea{resize:vertical}.toolbar #search{flex:1;min-width:220px}
@media(max-width:1180px){header{padding:24px}.toolbar{padding:20px 24px}.board{padding:0 24px 28px;gap:14px}.column{flex-basis:310px}.stagejump{display:block;width:100%}.stagejump select{width:100%}#status{width:100%;margin-left:0}.plus{min-width:44px}.card{padding:18px}footer{padding:0 24px 20px}}
@media(max-width:850px){header{align-items:flex-start}header #new{white-space:nowrap}.column{flex-basis:calc((100vw - 62px)/2);min-width:290px}.toolbar{gap:10px}}
@media(max-width:600px){header{flex-wrap:wrap;padding:20px}header #new{width:100%}.toolbar{padding:16px 20px}.toolbar #search{width:100%;min-width:0;flex-basis:100%}.toolbar #filter{flex:1}.board{padding:0 20px 24px}.column{flex-basis:calc(100vw - 56px);min-width:0}.row{flex-direction:column}dialog{padding:20px;max-height:calc(100dvh - 24px)}.actions{flex-wrap:wrap;position:sticky;bottom:-20px;background:white;padding:12px 0}.actions button{flex:1}footer{padding:0 20px 20px}}
@media(pointer:coarse){.card{cursor:pointer}select,button{min-height:48px}}
</style></head><body><header><div><small>FORMA DESIGN CONSULTANTS</small><h1>Project board</h1><span style="color:#afbdd0">From first conversation to final handoff.</span></div><button id="new" style="background:#fff;color:#152d49">＋ New project</button></header><div class="toolbar"><input id="search" placeholder="Search projects, clients, notes…" style="min-width:270px"><select id="filter"><option value="">All priorities</option><option>High</option><option>Normal</option><option>Low</option></select><button class="secondary" id="export">Export backup</button><button class="secondary" id="import">Import backup</button><input type="file" id="backup" accept="application/json" hidden><label class="stagejump">Jump to stage<select id="jump" aria-label="Jump to board stage"></select></label><span id="status">Loading…</span></div><main class="board" id="board"></main><footer>Tap a card to edit. Use its stage selector to move it, or drag with a mouse. Cards save in this browser. Export a backup to move them to another device.</footer><dialog id="dialog"><form id="form"><h2 id="heading" style="margin:0 0 5px">New project</h2><label>Project name<input name="title" required maxlength="180" placeholder="e.g. Modesto • 749 sqft ADU"></label><div class="row"><label>Client<input name="client" maxlength="180"></label><label>Assignee<input name="assignee" maxlength="100" placeholder="Cody / Jesús"></label></div><label>Property address<input name="address" maxlength="300"></label><div class="row"><label>Stage<select name="stage" id="stage"></select></label><label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Low</option></select></label></div><label>Due date<input name="due" type="date"></label><label>Notes / next action<textarea name="notes" rows="4" maxlength="10000"></textarea></label><div class="actions"><button type="button" id="delete" class="danger">Delete</button><button type="button" id="cancel" class="secondary">Cancel</button><button id="save">Save project</button></div></form></dialog><script>
const stages=['Design','Client Review / Payment 1','MEP / Payment 2','Prep for Submittal / Payment 3','City / County Review','Corrections','Completed'];const legacyStages={'Lead':'Design','Site Visit / Measure':'Design','Permitting':'City / County Review','Contractor Bids':'Prep for Submittal / Payment 3'};let cards=[],editing=null;const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('#stage').innerHTML=stages.map(s=>'<option>'+s+'</option>').join('');$('#jump').innerHTML=stages.map((s,i)=>'<option value="'+i+'">'+s+'</option>').join('');$('#jump').onchange=e=>document.querySelector('[data-stage="'+e.target.value+'"]').scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});
const storageKey='forma-kanban-v1';
async function api(path,options){let saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(saved))throw Error('Invalid saved board');if(options?.method==='POST'){const c=JSON.parse(options.body),i=saved.findIndex(x=>x.id===c.id);if(i<0)saved.unshift(c);else saved[i]=c;localStorage.setItem(storageKey,JSON.stringify(saved));return {ok:true}}if(options?.method==='DELETE'){saved=saved.filter(c=>c.id!==path.slice(1));localStorage.setItem(storageKey,JSON.stringify(saved));return {ok:true}}return saved}

function render(){const q=$('#search').value.toLowerCase(),p=$('#filter').value;$('#board').innerHTML=stages.map((s,i)=>{const list=cards.filter(c=>c.stage===s&&(!p||c.priority===p)&&JSON.stringify(c).toLowerCase().includes(q));return '<section class="column" data-stage="'+i+'"><div class="colhead">'+s+' <span><span class="count">'+list.length+'</span> <button class="plus" data-add="'+i+'" aria-label="Add project">+</button></span></div>'+list.map(c=>'<article class="card" draggable="true" data-id="'+esc(c.id)+'" tabindex="0" role="button"><span class="tag '+esc(c.priority)+'">'+esc(c.priority)+'</span><h3>'+esc(c.title)+'</h3>'+(c.client?'<p>'+esc(c.client)+'</p>':'')+(c.address?'<p>'+esc(c.address)+'</p>':'')+'<div class="meta"><span>'+esc(c.assignee||'Unassigned')+'</span><span>'+esc(c.due||'No due date')+'</span></div><label class="move-label">Move to stage<select class="move-stage" data-move="'+esc(c.id)+'" aria-label="Move '+esc(c.title)+' to stage">'+stages.map(stage=>'<option '+(stage===c.stage?'selected':'')+'>'+esc(stage)+'</option>').join('')+'</select></label></article>').join('')+(list.length?'':'<div class="empty">No projects here yet</div>')+'</section>'}).join('');$('#status').textContent=cards.length+' projects • Saved';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>open(null,stages[b.dataset.add]));document.querySelectorAll('.card').forEach(el=>{el.onclick=e=>{if(!e.target.closest('.move-label'))open(cards.find(c=>c.id===el.dataset.id))};el.onkeydown=e=>{if(e.key==='Enter'&&e.target===el)el.click()};el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id)});document.querySelectorAll('[data-move]').forEach(el=>{el.onclick=e=>e.stopPropagation();el.onkeydown=e=>e.stopPropagation();el.onchange=async e=>{e.stopPropagation();const c=cards.find(c=>c.id===el.dataset.move);el.disabled=true;if(!await persist({...c,stage:el.value})){el.value=c.stage;el.disabled=false}}});document.querySelectorAll('.column').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('drop')};el.ondragleave=()=>el.classList.remove('drop');el.ondrop=async e=>{e.preventDefault();el.classList.remove('drop');const c=cards.find(c=>c.id===e.dataTransfer.getData('text/plain'));if(c)await persist({...c,stage:stages[el.dataset.stage]})}})}
function open(c,stage){editing=c?.id||null;$('#form').reset();$('#heading').textContent=c?'Edit project':'New project';$('#delete').hidden=!c;if(c)for(const k of ['title','client','assignee','address','stage','priority','due','notes'])$('#form').elements[k].value=c[k]||'';else $('#stage').value=stage||stages[0];$('#dialog').showModal()}
async function persist(c){$('#status').textContent='Saving…';try{await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});const i=cards.findIndex(x=>x.id===c.id);if(i<0)cards.unshift(c);else cards[i]=c;render();return true}catch(e){$('#status').textContent=e.message;return false}}
$('#new').onclick=()=>open();$('#cancel').onclick=()=>$('#dialog').close();$('#search').oninput=render;$('#filter').onchange=render;$('#form').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;const c=Object.fromEntries(new FormData(e.target));c.id=editing||crypto.randomUUID();if(await persist(c))$('#dialog').close();$('#save').disabled=false};$('#delete').onclick=async()=>{if(!confirm('Delete this project?'))return;try{await api('/'+editing,{method:'DELETE'});cards=cards.filter(c=>c.id!==editing);$('#dialog').close();render()}catch(e){$('#status').textContent=e.message}};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='forma-board-backup.json';a.click();URL.revokeObjectURL(a.href)};$('#import').onclick=()=>$('#backup').click();$('#backup').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||data.some(c=>typeof c.id!=='string'||typeof c.title!=='string'||!stages.includes(legacyStages[c.stage]||c.stage)))throw Error('Invalid backup');if(!confirm('Merge these '+data.length+' projects into this browser’s board?'))return;for(const c of data)await api('',{method:'POST',body:JSON.stringify({...c,stage:legacyStages[c.stage]||c.stage})});cards=await api('');render()}catch(err){alert('Could not import: '+err.message)}finally{e.target.value=''}};api('').then(data=>{cards=data.map(c=>({...c,stage:legacyStages[c.stage]||c.stage}));render()}).catch(()=>$('#status').textContent='Unable to load projects. Refresh to retry.');
</script></body></html>
